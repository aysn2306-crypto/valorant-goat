# League "2nd greatest after Faker": algorithm v3 carried over from the Valorant video. DRAFT, not approved by ay.
approved: false
version: 3

pool:
  min_games: 150          # major leagues + Worlds/MSI/First Stand, 2011 to Worlds 2026
  benchmark: Faker        # ay 17 Nov: Faker is ranked like everyone else (no calibration)

trophy_points:            # full value, no diminishing returns (ay's rule)
  worlds:      {1: 100, 2: 60, 3: 35}
  msi:         {1: 50, 2: 30, 3: 18}
  first_stand: {1: 25, 2: 15, 3: 9}
  msc:         {1: 15, 2: 9, 3: 5}
  domestic:    {1: 20, 2: 10, 3: 5}      # times region strength that year
  awards: {worlds_mvp: 15, msi_mvp: 8, first_stand_mvp: 5}   # Finals MVP or event MVP, full value
  domestic_cup: 0.5                      # LCK Cup and LPL split titles from 2025 (several per year) count half
  min_share_of_games: 0.5
  early_worlds: {2011: 0.5, 2012: 0.75}  # 8 and 12 team events with thin fields

credit: {alpha: 0.5, min: 0.5, max: 1.5, shrink_games: 10}

impact:                   # per game, z-scored inside role + year
  impact: [kda, kp, dpm, gold_share, low_deaths]
  carry: [dpm, gold_share]
  clean: [kda, low_deaths]
  region_penalty_sd: 1.0  # domestic numbers lose (1 - region strength) standard deviations
  shrink_games: 40

categories:               # sums to 100
  trophies: 28
  big_stage: 15
  peak: 12
  winning: 10
  longevity: 10
  carry: 10
  clean_play: 8
  consistency: 7

robustness: {runs: 1000, max_weight_change: 0.30}
longevity: {min_games: 20, min_impact: 0.2}   # an elite year: 20+ games at 0.2 SD above the role average, after shrinkage
best_years: 5
